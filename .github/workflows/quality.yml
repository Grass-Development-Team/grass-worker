name: Quality

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build output
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Console dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            apps/console/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('apps/console/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Just
        uses: extractions/setup-just@v4

      - name: Install Console dependencies
        run: bun install --cwd apps/console --frozen-lockfile

      - name: Check workspace
        run: just check

      - name: Lint Rust workspace
        run: just clippy

      - name: Test workspace
        run: just test
