name: Quality

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build output
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.10.0
        with:
          working-directory: apps/console
          node-version: "lts"
          cache: true
          run-install: |
            - cwd: .
              args: ["--frozen-lockfile"]

      - name: Install Just
        uses: extractions/setup-just@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Check Rust workspace
        run: just check rust

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check Console workspace
        run: just check console

      - name: Lint Rust workspace
        run: just clippy

      - name: Test Rust workspace
        run: just test rust
        env:
          GRASS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

      - name: Test Console workspace
        run: just test console

      - name: Check project license metadata
        run: just license-check

      - name: Audit Rust dependencies
        run: cargo audit

      - name: Audit Console dependencies
        run: cd apps/console && vp pm audit
