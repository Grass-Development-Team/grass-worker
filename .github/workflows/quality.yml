name: Quality

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build output
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.10.0
        with:
          working-directory: apps/console
          node-version: "lts"
          cache: true
          run-install: |
            - cwd: .
              args: ["--frozen-lockfile"]

      - name: Install Just
        uses: extractions/setup-just@v4

      - name: Check Rust workspace
        run: just check rust

      - name: Check Console workspace
        run: just check console

      - name: Lint Rust workspace
        run: just clippy

      - name: Test Rust workspace
        run: just test rust

      - name: Test Console workspace
        run: just test console
