name: Quality

on:
  workflow_call:
  pull_request:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build output
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.10.0
        with:
          working-directory: apps/console
          node-version: "lts"
          cache: true
          run-install: |
            - cwd: .
              args: ["--frozen-lockfile"]

      - name: Install Just
        uses: extractions/setup-just@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Check Rust workspace
        run: just check rust

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check Console workspace
        run: just check console

      - name: Lint Rust workspace
        run: just clippy

      - name: Test Rust workspace
        run: just test rust

      - name: Test Console workspace
        run: just test console

      - name: Verify embedded Console asset rebuilds
        run: just assets-check

      - name: Verify release metadata policy
        run: just release-check

      - name: Check project license metadata
        run: just license-check

      - name: Audit Rust dependencies
        run: cargo audit

      - name: Audit Console dependencies
        run: cd apps/console && vp pm audit

  node-delivery-smoke:
    name: Node delivery smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and smoke build output
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-node-delivery-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-node-delivery-
            ${{ runner.os }}-cargo-

      - name: Build Node runtime image
        run: docker build --tag grass-build:smoke docker/build-image

      - name: Exercise checkout, build, output, and static delivery
        run: >-
          cargo test -p grass-node
          serve::release_smoke::checks_out_builds_packages_stages_and_serves_vite
          -- --ignored --exact --nocapture
        env:
          GRASS_NODE_SMOKE_IMAGE: grass-build:smoke
          GRASS_NODE_SMOKE_SOCKET: unix:///var/run/docker.sock

  msrv:
    name: Rust MSRV (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-msrv
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-msrv@0.18.4

      - name: Cache minimum-version build output
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}

      - name: Verify the workspace minimum Rust version
        run: cargo msrv verify --manifest-path apps/control-api/Cargo.toml --no-log -- cargo check --workspace --all-targets --locked

  service-regressions:
    name: PostgreSQL and Redis regressions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Just
        uses: extractions/setup-just@v4

      - name: Cache service regression build output
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-services-${{ hashFiles('Cargo.lock') }}

      - name: Run complete PostgreSQL and Redis regressions
        run: just test-services
        env:
          GRASS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          GRASS_TEST_REDIS_URL: redis://localhost:6379/0
