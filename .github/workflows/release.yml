name: Release

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  RUNTIME_IMAGE: ghcr.io/grass-development-team/grass-worker

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive Debian image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.RUNTIME_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Derive Slim image metadata
        id: meta-slim
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.RUNTIME_IMAGE }}
          flavor: suffix=-slim
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Derive Alpine image metadata
        id: meta-alpine
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.RUNTIME_IMAGE }}
          flavor: suffix=-alpine
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Prepare Bake labels
        id: bake-labels
        env:
          LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          {
            echo 'labels_json<<EOF'
            printf '%s\n' "$LABELS" | jq -Rn '[inputs | split("=") | {(.[0]): (.[1:] | join("="))}] | add // {}'
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build and push runtime variants
        uses: docker/bake-action@v6
        with:
          files: docker-bake.hcl
          push: true
        env:
          IMAGE: ${{ env.RUNTIME_IMAGE }}
          TAGS_DEBIAN: ${{ steps.meta.outputs.tags }}
          TAGS_SLIM: ${{ steps.meta-slim.outputs.tags }}
          TAGS_ALPINE: ${{ steps.meta-alpine.outputs.tags }}
          LABELS_JSON: ${{ steps.bake-labels.outputs.labels_json }}

  binaries:
    name: Release binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and build output
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.10.0
        with:
          working-directory: apps/console
          node-version: "lts"
          cache: true
          run-install: |
            - cwd: .
              args: ["--frozen-lockfile"]

      - name: Build Console
        working-directory: apps/console
        run: vp build

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }} -p grass-control-api -p grass-node

      - name: Package artifacts
        run: |
          mkdir -p dist
          tar -C target/${{ matrix.target }}/release -czf \
            dist/grass-worker-${{ github.ref_name }}-${{ matrix.target }}.tar.gz \
            grass-control-api grass-node

      - name: Attach artifacts to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
