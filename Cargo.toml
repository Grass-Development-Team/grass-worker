[workspace]
members = [
  "apps/control-api",
  "apps/node",
  "crates/archive",
  "crates/assets",
  "crates/config",
  "crates/crypto",
  "crates/node-protocol",
  "crates/session",
  "crates/token",
  "crates/validator",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/yuanzui-cf/grass-worker"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.100"
axum = "0.8.7"
config = { version = "0.15.19", default-features = false, features = ["toml"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal", "net"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
