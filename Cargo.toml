[workspace]
members = [
  "apps/control-api",
  "apps/node",
  "crates/archive",
  "crates/assets",
  "crates/cache",
  "crates/config",
  "crates/crypto",
  "crates/git-source",
  "crates/node-protocol",
  "crates/session",
  "crates/token",
  "crates/validator",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/yuanzui-cf/grass-worker"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.100"
argon2 = { version = "0.5", features = ["std"] }
async-trait = "0.1"
axum = { version = "0.8.7", features = ["ws"] }
axum-extra = { version = "0.10", features = ["cookie"] }
base64 = "0.22"
clap = { version = "4.5.50", features = ["derive", "env"] }
config = { version = "0.15.19", default-features = false, features = ["toml"] }
hex = "0.4"
mime_guess = "2"
moka = { version = "0.12", features = ["future"] }
rand = "0.8"
redis = { version = "0.31.0", default-features = false, features = ["tokio-comp", "aio", "script"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
ring = "0.17"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
rust-embed = "8"
sea-orm = { version = "2.0.0-rc.38", default-features = false, features = ["macros", "sqlx-postgres", "runtime-tokio-rustls", "with-json", "with-time", "with-uuid"] }
sea-orm-migration = { version = "2.0.0-rc.38", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "with-json", "with-time", "with-uuid"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10"
sysinfo = "0.35"
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["serde"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal", "net"] }
toml = { version = "0.8" }
tower-http = { version = "0.6", features = ["cors", "compression-full", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
url = "2.5.4"
uuid = { version = "1.18.1", features = ["serde", "v7"] }
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
bollard = "0.19"
tar = "0.4"
futures-util = "0.3"

grass-archive = { path = "crates/archive" }
grass-assets = { path = "crates/assets" }
grass-cache = { path = "crates/cache" }
grass-config = { path = "crates/config" }
grass-crypto = { path = "crates/crypto" }
grass-git-source = { path = "crates/git-source" }
grass-node-protocol = { path = "crates/node-protocol" }
grass-session = { path = "crates/session" }
grass-token = { path = "crates/token" }
grass-validator = { path = "crates/validator" }
