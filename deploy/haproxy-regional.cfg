# HAProxy 2.8+: replace documentation addresses/hostname before deployment.
# Validate with: haproxy -c -f deploy/haproxy-regional.cfg
global
    log stdout format raw local0
    maxconn 4096

defaults
    log global
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    timeout tunnel 1h

frontend regional_http
    bind :80
    mode http
    # Public HTTP serves ACME challenges and sites, never internal Node APIs.
    http-request deny if { path_beg /_grass/internal/ }
    default_backend regional_http_nodes

backend regional_http_nodes
    mode http
    balance roundrobin
    option httpchk
    http-check send meth GET uri /_grass/health ver HTTP/1.1 hdr Host eu.entry.example.net
    http-check expect status 200
    server entry_a 192.0.2.11:8080 check inter 2s fall 2 rise 2
    server entry_b 192.0.2.12:8080 check inter 2s fall 2 rise 2

frontend regional_https
    bind :443
    mode tcp
    default_backend regional_https_nodes

backend regional_https_nodes
    mode tcp
    balance roundrobin
    # HTTPS is passed through unchanged, including the original SNI and Host.
    # Probe the separate HTTP listener; do not send plaintext to port 8443.
    option httpchk
    http-check connect port 8080
    http-check send meth GET uri /_grass/health ver HTTP/1.1 hdr Host eu.entry.example.net
    http-check expect status 200
    server entry_a 192.0.2.11:8443 check inter 2s fall 2 rise 2
    server entry_b 192.0.2.12:8443 check inter 2s fall 2 rise 2
